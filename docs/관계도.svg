<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1200" viewBox="0 0 1820 1200" role="img" aria-labelledby="t d">
  <title id="t">One-Stop Multi-Agent Mobile Console 관계도 (2026-09-17)</title>
  <desc id="d">스마트폰, 작업 PC, 클라우드·AI 워커 세 축의 관계. Claude Code는 PC의 진짜 Claude Code 창이고 폰은 그 창을 읽고(transcript) 쓴다(콘솔 주입). Codex·Antigravity·Grok 셋은 데몬 워커이며 Claude Code가 파이프로 위임할 수 있다. 원격 터널링·미러링·파이프 위임 세 기술이 어디에 해당하는지, 보안 관문이 무엇인지 보여준다.</desc>

  <style>
    .bg{fill:#fafaf7}
    .panel{fill:#ffffff;stroke:#dce5de;stroke-width:2}
    .panelHead{fill:#eaf2ed;stroke:#dce5de;stroke-width:2}
    .card{fill:#ffffff;stroke:#5f6b7a;stroke-width:2}
    .cardGreen{fill:#eaf2ed;stroke:#2d6a4f;stroke-width:3}
    .cardGold{fill:#fff8e7;stroke:#c9a961;stroke-width:3}
    .cardDark{fill:#0a1f14}
    .secBox{fill:#ffffff;stroke:#0a1f14;stroke-width:2}
    .title{font:700 38px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .sub{font:20px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .legend{font:18px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .colHead{font:700 24px 'Malgun Gothic',Arial,sans-serif;fill:#2d6a4f}
    .cardHead{font:700 20px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .tag{font:700 18px 'Malgun Gothic',Arial,sans-serif;fill:#c9a961}
    .body{font:18px 'Malgun Gothic',Arial,sans-serif;fill:#3a3a30}
    .bodyLight{font:18px 'Malgun Gothic',Arial,sans-serif;fill:#fafaf7}
    .note{font:17px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .secHead{font:700 22px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .secBody{font:18px 'Malgun Gothic',Arial,sans-serif;fill:#3a3a30}
    .flow{stroke:#2d6a4f;stroke-width:3;fill:none;marker-end:url(#a)}
    .flowGold{stroke:#c9a961;stroke-width:3;fill:none;marker-end:url(#ag)}
    .flowGray{stroke:#5f6b7a;stroke-width:2;fill:none;stroke-dasharray:9 7;marker-end:url(#agr)}
    .edgeLabel{font:16px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a;paint-order:stroke;stroke:#fafaf7;stroke-width:9;stroke-linejoin:round}
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a961"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1820" height="1200"/>

  <text class="title" x="60" y="66">One-Stop Multi-Agent Mobile Console — 관계도</text>
  <text class="sub" x="60" y="98">사람은 스마트폰 하나만 들고, 실행은 켜 둔 작업 PC에서만 일어나며, 클라우드는 길과 장부만 맡는다</text>
  <text class="legend" x="60" y="126">세 기술 — ① 터널링 ② 미러링(읽기·쓰기) ③ 파이프 위임 · 상세는 각 카드 참조</text>

  <!-- ============ 왼쪽: 스마트폰 ============ -->
  <rect class="panel" x="60" y="158" width="470" height="824" rx="10"/>
  <rect class="panelHead" x="60" y="158" width="470" height="52" rx="10"/>
  <text class="colHead" x="86" y="193">스마트폰 (어디서든)</text>

  <rect class="cardGreen" x="90" y="222" width="410" height="108" rx="8"/>
  <text class="cardHead" x="114" y="254">허브 접속</text>
  <text class="body" x="114" y="282">허브 고정 주소 — 앱 설치 없음</text>
  <text class="body" x="114" y="308">장부에서 PC 목록 조회 → 탭 선택</text>

  <rect class="card" x="90" y="344" width="410" height="228" rx="8"/>
  <text class="cardHead" x="114" y="376">탭 5개</text>
  <text class="body" x="114" y="404">Claude Code · Codex · Antigravity · Grok</text>
  <text class="body" x="114" y="430">+ 프로젝트 탭 (탭에 역할 표기는 없음)</text>
  <text class="note" x="114" y="456">프로젝트 탭 예: M&amp;A 제안서 배포·매칭</text>
  <text class="note" x="114" y="480">같은 업무 전용 탭도 함께 둘 수 있다</text>
  <text class="body" x="114" y="508">대화 보기: 요약 / 상세 / 전체</text>
  <text class="body" x="114" y="534">PC 여러 대면 탭으로 즉시 전환</text>

  <rect class="card" x="90" y="586" width="410" height="96" rx="8"/>
  <text class="cardHead" x="114" y="618">업로드</text>
  <text class="body" x="114" y="646">버튼 하나 — 폰 기본 선택창(카메라·</text>
  <text class="body" x="114" y="670">캠코더·파일), 25MB, 해당 워커 자동 분석</text>

  <rect class="card" x="90" y="698" width="410" height="96" rx="8"/>
  <text class="cardHead" x="114" y="730">긴급 정지</text>
  <text class="body" x="114" y="758">Claude Code: PC 창에 Ctrl+C 주입</text>
  <text class="body" x="114" y="782">데몬 워커: 해당 프로세스 종료</text>

  <rect class="cardGold" x="90" y="810" width="410" height="96" rx="8"/>
  <text class="cardHead" x="114" y="842">보안 — 접속</text>
  <text class="body" x="114" y="870">PIN 1회 → 세션 쿠키(HttpOnly·24시간)</text>
  <text class="body" x="114" y="894">자격증명 없는 요청은 401로 차단</text>

  <!-- ============ 가운데: 작업 PC ============ -->
  <rect class="panel" x="600" y="158" width="500" height="824" rx="10"/>
  <rect class="panelHead" x="600" y="158" width="500" height="52" rx="10"/>
  <text class="colHead" x="626" y="193">작업 PC (켜 둔 내 컴퓨터)</text>

  <rect class="cardGold" x="630" y="222" width="440" height="140" rx="8"/>
  <text class="cardHead" x="654" y="254">tunnel.js — 터널 · 등록</text>
  <text class="tag" x="1042" y="254">①</text>
  <text class="body" x="654" y="282">Cloudflare Tunnel로 공개 주소 발급</text>
  <text class="body" x="654" y="308">포트 개방·고정 IP 불필요</text>
  <text class="note" x="654" y="334">주소는 켤 때마다 바뀐다 — 장부가 안내</text>
  <text class="note" x="654" y="356">허브에도 devices.json을 함께 배포</text>

  <rect class="cardGreen" x="630" y="388" width="440" height="148" rx="8"/>
  <text class="cardHead" x="654" y="420">server.js (7890) — 콘솔 서버</text>
  <text class="body" x="654" y="448">화면(5탭)과 API를 한 파일에서 제공</text>
  <text class="body" x="654" y="472">인증(쿠키·PIN)·업로드 처리</text>
  <text class="note" x="654" y="496">폰은 1.2~1.5초 폴링, WebSocket 없음</text>
  <text class="note" x="654" y="518">폴더 밖 이동·위험 명령 차단</text>

  <rect class="cardGreen" x="630" y="616" width="440" height="168" rx="8"/>
  <text class="cardHead" x="654" y="648">PC 창 브릿지 — 창 찾기 + 콘솔 주입</text>
  <text class="tag" x="1042" y="648">②</text>
  <text class="body" x="654" y="676">main_worker_bridge.js — 창 찾기</text>
  <text class="note" x="654" y="700">(proc_cwd.ps1, 작업 폴더 cwd 기준)</text>
  <text class="body" x="654" y="726">console_inject.ps1 — AttachConsole +</text>
  <text class="body" x="654" y="750">WriteConsoleInput (포커스 안 뺏음)</text>
  <text class="note" x="654" y="774">PC에 이 창은 한 개, 다른 창은 제외</text>

  <rect class="card" x="630" y="834" width="440" height="134" rx="8"/>
  <text class="cardHead" x="654" y="866">데몬 브릿지</text>
  <text class="tag" x="962" y="866">③</text>
  <text class="body" x="654" y="894">codex_ · antigravity_ · grok_bridge.js</text>
  <text class="body" x="654" y="918">— 데몬 호출, 화면 없음</text>
  <text class="note" x="654" y="944">delegate.js — PC 창 → 데몬 위임 파이프</text>

  <!-- ============ 오른쪽: 클라우드 · AI 워커 ============ -->
  <rect class="panel" x="1290" y="158" width="470" height="824" rx="10"/>
  <rect class="panelHead" x="1290" y="158" width="470" height="52" rx="10"/>
  <text class="colHead" x="1316" y="193">클라우드 · AI 워커</text>

  <rect class="cardGold" x="1320" y="222" width="410" height="108" rx="8"/>
  <text class="cardHead" x="1344" y="254">Cloudflare 터널</text>
  <text class="tag" x="1690" y="254">①</text>
  <text class="body" x="1344" y="282">PC 안 7890 포트 ↔ 공개 https 주소</text>
  <text class="body" x="1344" y="306">PC가 밖으로 먼저 연결해 길을 연다</text>

  <rect class="card" x="1320" y="344" width="410" height="116" rx="8"/>
  <text class="cardHead" x="1344" y="376">기기 장부 (GitHub Gist)</text>
  <text class="body" x="1344" y="404">PC 이름·프로젝트·주소를 등록</text>
  <text class="note" x="1344" y="428">읽을 때는 API(무캐시) — raw CDN 5분</text>
  <text class="note" x="1344" y="450">캐시로 옛 주소 덮어쓰던 사고 해결</text>

  <rect class="cardGold" x="1320" y="500" width="410" height="108" rx="8"/>
  <text class="cardHead" x="1344" y="532">허브 (devices.json)</text>
  <text class="body" x="1344" y="560">폰의 고정 접속 주소, PC 탭 목록 제공</text>
  <text class="body" x="1344" y="584">각 PC가 실제 응답할 때만 초록불</text>

  <rect class="cardDark" x="1320" y="622" width="410" height="216" rx="8"/>
  <text class="cardHead" x="1344" y="654" style="fill:#fafaf7">워커 4 (전부 PC 안에서 실행)</text>
  <text class="bodyLight" x="1344" y="684">Claude Code — Opus 5 — PC 창 대화형</text>
  <text class="bodyLight" x="1344" y="710">Codex — GPT-5.6 — 데몬</text>
  <text class="bodyLight" x="1344" y="736">Antigravity — Gemini 3.8 Flash — 데몬</text>
  <text class="bodyLight" x="1344" y="760">Grok — grok-4.6 — 데몬</text>
  <text class="bodyLight" x="1344" y="792">같은 작업 폴더를 읽고·쓰고 실행</text>
  <text class="bodyLight" x="1344" y="816">— 넷의 능력은 대등하다</text>

  <text class="note" x="1320" y="866">Claude Code는 PC 창의 그 프로세스 그대로다 —</text>
  <text class="note" x="1320" y="888">별도로 또 띄우지 않는다.</text>
  <text class="note" x="1320" y="920">탭 선택 후 실제 지시·응답 트래픽은</text>
  <text class="note" x="1320" y="942">이 터널을 그대로 통과한다.</text>

  <!-- ============ 화살표 ============ -->
  <!-- 1. 스마트폰 → 허브 -->
  <path class="flowGold" d="M 500 270 L 565 270 L 565 140 L 1150 140 L 1150 540 L 1320 540"/>
  <text class="edgeLabel" x="900" y="134">허브 고정 주소 접속 → PC 목록</text>

  <!-- 2. 허브 → 기기 장부 (장부 조회) -->
  <path class="flowGray" d="M 1400 500 L 1400 460"/>
  <text class="edgeLabel" x="1412" y="484">장부 조회</text>

  <!-- 3. 허브 → server.js (4초 생존 확인) -->
  <path class="flowGray" d="M 1320 570 L 1250 570 L 1250 470 L 1070 470"/>
  <text class="edgeLabel" x="1160" y="464" text-anchor="middle">4초 생존 확인</text>

  <!-- 4. Cloudflare 터널 → server.js (터널 경유) -->
  <path class="flowGold" d="M 1320 300 L 1200 300 L 1200 440 L 1070 440"/>
  <text class="edgeLabel" x="1260" y="294" text-anchor="middle">터널 경유</text>

  <!-- 5. tunnel.js → Cloudflare 터널 (터널 개통) -->
  <path class="flow" d="M 1070 300 L 1115 300 L 1115 250 L 1320 250"/>
  <text class="edgeLabel" x="1200" y="244" text-anchor="middle">터널 개통</text>

  <!-- 6. tunnel.js → 기기 장부 (60초 하트비트) -->
  <path class="flow" d="M 1070 330 L 1135 330 L 1135 400 L 1320 400"/>
  <text class="edgeLabel" x="1200" y="394" text-anchor="middle">60초 하트비트</text>

  <!-- 7. server.js → PC 창 브릿지 (쓰기: 콘솔 주입) -->
  <path class="flow" d="M 760 536 L 760 616"/>
  <text class="edgeLabel" x="772" y="562">쓰기: 콘솔 주입</text>

  <!-- 8. PC 창 브릿지 → server.js (읽기: transcript) -->
  <path class="flowGray" d="M 920 616 L 920 536"/>
  <text class="edgeLabel" x="932" y="600">읽기: transcript</text>

  <!-- 9. PC 창 브릿지 → 데몬 브릿지 (위임 파이프) -->
  <path class="flowGold" d="M 850 784 L 850 834"/>
  <text class="edgeLabel" x="862" y="812">위임 파이프</text>

  <!-- 10. 데몬 브릿지 → 워커 4 (데몬 실행) -->
  <path class="flow" d="M 1070 900 L 1150 900 L 1150 760 L 1320 760"/>
  <text class="edgeLabel" x="1160" y="754" text-anchor="middle">데몬 실행</text>

  <!-- ============ 보안 요약 상자 ============ -->
  <rect class="secBox" x="60" y="1000" width="1700" height="118" rx="10"/>
  <text class="secHead" x="86" y="1032">보안</text>
  <text class="secBody" x="86" y="1064">PIN 1회 → 세션 쿠키 m_sid(HttpOnly·24시간)</text>
  <text class="secBody" x="660" y="1064">자격증명 없는 요청은 401 차단</text>
  <text class="secBody" x="1220" y="1064">PIN 5회 실패 시 해당 IP 5분 차단</text>
  <text class="secBody" x="86" y="1096">프로젝트 폴더 밖 이동·위험 명령(format·shutdown 등) 차단</text>
  <text class="secBody" x="900" y="1096">예외: /api/devices만 무인증 — 기기명·프로젝트명·시각만 노출</text>

  <text class="note" x="60" y="1166">2026-09-17 현행화 · PC 창 워커 Antigravity → Claude Code · 최종 방식 = PC 창 + 콘솔 주입 · Grok 추가 · 메인/서브 호칭 폐지</text>
</svg>
