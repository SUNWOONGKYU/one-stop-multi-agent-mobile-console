<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1320" viewBox="0 0 1820 1320" role="img" aria-labelledby="t d">
  <title id="t">One-Stop Multi-Agent Mobile Console 작업 흐름도 (2026-09-17)</title>
  <desc id="d">PC 기동, 폰 접속, 지시·실행·회신까지 13단계를 스마트폰·클라우드·작업 PC·AI 워커 네 레인으로 나눠 보여준다. 기동은 PC에서 한 번, 접속은 폰에서 한 번, 지시·실행·회신은 반복한다. 메인 탭은 콘솔 주입, 서브 탭은 데몬 실행, 메인이 위임하면 delegate.js가 파이프로 서브를 부른다.</desc>

  <style>
    .bg{fill:#fafaf7}
    .lane{fill:#ffffff;stroke:#dce5de;stroke-width:2}
    .laneHead{fill:#eaf2ed;stroke:#dce5de;stroke-width:2}
    .bandLabel{font:700 20px 'Malgun Gothic',Arial,sans-serif;fill:#2d6a4f}
    .step{fill:#ffffff;stroke:#5f6b7a;stroke-width:2}
    .stepGreen{fill:#eaf2ed;stroke:#2d6a4f;stroke-width:3}
    .stepGold{fill:#fff8e7;stroke:#c9a961;stroke-width:3}
    .stepDark{fill:#0a1f14}
    .title{font:700 38px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .sub{font:20px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .colHead{font:700 24px 'Malgun Gothic',Arial,sans-serif;fill:#2d6a4f}
    .num{font:700 22px 'Malgun Gothic',Arial,sans-serif;fill:#2d6a4f}
    .numLight{font:700 22px 'Malgun Gothic',Arial,sans-serif;fill:#c9a961}
    .head{font:700 19px 'Malgun Gothic',Arial,sans-serif;fill:#0a1f14}
    .headLight{font:700 19px 'Malgun Gothic',Arial,sans-serif;fill:#fafaf7}
    .body{font:17px 'Malgun Gothic',Arial,sans-serif;fill:#3a3a30}
    .bodyLight{font:17px 'Malgun Gothic',Arial,sans-serif;fill:#fafaf7}
    .note{font:16px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a}
    .flow{stroke:#2d6a4f;stroke-width:3;fill:none;marker-end:url(#a)}
    .flowGold{stroke:#c9a961;stroke-width:3;fill:none;marker-end:url(#ag)}
    .flowGray{stroke:#5f6b7a;stroke-width:2;fill:none;stroke-dasharray:9 7;marker-end:url(#agr)}
    .edgeLabel{font:16px 'Malgun Gothic',Arial,sans-serif;fill:#5f6b7a;paint-order:stroke;stroke:#fafaf7;stroke-width:9;stroke-linejoin:round}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6a4f"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c9a961"/></marker>
    <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6b7a"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1820" height="1320"/>
  <text class="title" x="60" y="66">One-Stop Multi-Agent Mobile Console — 작업 흐름도</text>
  <text class="sub" x="60" y="98">PC에서 기동 한 번, 폰에서 접속 한 번 — 그 뒤로는 지시하고 결과를 받는 일만 반복된다</text>

  <!-- 레인 4개 -->
  <rect class="lane" x="60" y="150" width="400" height="1060" rx="10"/>
  <rect class="laneHead" x="60" y="150" width="400" height="52" rx="10"/>
  <text class="colHead" x="86" y="185">스마트폰</text>

  <rect class="lane" x="480" y="150" width="380" height="1060" rx="10"/>
  <rect class="laneHead" x="480" y="150" width="380" height="52" rx="10"/>
  <text class="colHead" x="506" y="185">클라우드</text>

  <rect class="lane" x="880" y="150" width="460" height="1060" rx="10"/>
  <rect class="laneHead" x="880" y="150" width="460" height="52" rx="10"/>
  <text class="colHead" x="906" y="185">작업 PC</text>

  <rect class="lane" x="1360" y="150" width="400" height="1060" rx="10"/>
  <rect class="laneHead" x="1360" y="150" width="400" height="52" rx="10"/>
  <text class="colHead" x="1386" y="185">AI 워커</text>

  <!-- 밴드 라벨 -->
  <text class="bandLabel" x="60" y="232">A. 기동 — PC에서 한 번</text>
  <text class="bandLabel" x="60" y="500">B. 접속 — 폰에서 한 번</text>
  <text class="bandLabel" x="60" y="752">C. 지시 · 실행 · 회신 — 반복</text>

  <!-- ===== A. 기동 ===== -->
  <rect class="stepGreen" x="900" y="250" width="420" height="124" rx="8"/>
  <text class="num" x="920" y="282">1</text>
  <text class="head" x="950" y="282">콘솔 서버 기동</text>
  <text class="body" x="920" y="308">server.js(7890) 기동</text>
  <text class="body" x="920" y="330">Claude Code 창도 함께 확인</text>
  <text class="note" x="920" y="354">(없으면 그 폴더에 자동으로 하나 띄움)</text>

  <rect class="step" x="900" y="390" width="420" height="76" rx="8"/>
  <text class="num" x="920" y="422">2</text>
  <text class="head" x="950" y="422">터널 개통</text>
  <text class="body" x="920" y="450">tunnel.js → Cloudflare Tunnel 공개 주소</text>

  <rect class="stepGold" x="510" y="250" width="340" height="100" rx="8"/>
  <text class="numLight" x="530" y="282">3</text>
  <text class="head" x="560" y="282">장부 등록</text>
  <text class="body" x="530" y="308">기기 장부(Gist)에 API로 등록</text>
  <text class="note" x="530" y="332">이후 60초마다 하트비트로 재등록</text>

  <rect class="stepGold" x="510" y="366" width="340" height="76" rx="8"/>
  <text class="numLight" x="530" y="398">4</text>
  <text class="head" x="560" y="398">허브 배포</text>
  <text class="body" x="530" y="426">devices.json을 허브(Vercel)에 배포</text>

  <path class="flow" d="M 1110 374 L 1110 388"/>
  <path class="flow" d="M 898 428 L 852 330"/>
  <text class="edgeLabel" x="800" y="460" text-anchor="middle">주소 확보 후</text>
  <path class="flow" d="M 680 350 L 680 364"/>

  <!-- ===== B. 접속 ===== -->
  <rect class="stepGreen" x="90" y="518" width="340" height="92" rx="8"/>
  <text class="num" x="110" y="550">5</text>
  <text class="head" x="140" y="550">허브 접속</text>
  <text class="body" x="110" y="578">허브 고정 주소 — 앱 설치 없음</text>
  <text class="note" x="110" y="600">장부에서 PC 목록을 확인한다</text>

  <rect class="step" x="900" y="518" width="420" height="108" rx="8"/>
  <text class="num" x="920" y="550">6</text>
  <text class="head" x="950" y="550">생존 확인</text>
  <text class="body" x="920" y="578">각 PC의 /api/devices를 4초마다 확인</text>
  <text class="note" x="920" y="600">(무인증) — 실제 응답할 때만 폰에 초록불</text>

  <rect class="stepGreen" x="90" y="626" width="340" height="92" rx="8"/>
  <text class="num" x="110" y="658">7</text>
  <text class="head" x="140" y="658">탭 선택 · PIN</text>
  <text class="body" x="110" y="686">PC·워커 탭을 고르고 PIN 입력</text>
  <text class="note" x="110" y="708">→ 세션 쿠키(m_sid) 발급, 이후 자동</text>

  <path class="flow" d="M 430 564 L 898 564"/>
  <text class="edgeLabel" x="670" y="546" text-anchor="middle">PC 목록 확인</text>
  <path class="flowGray" d="M 900 605 L 670 605 L 670 670 L 430 670"/>
  <text class="edgeLabel" x="670" y="591" text-anchor="middle">응답 확인 — 초록불</text>

  <!-- ===== C. 지시·실행·회신 ===== -->
  <rect class="stepGreen" x="90" y="770" width="340" height="140" rx="8"/>
  <text class="num" x="110" y="802">8</text>
  <text class="head" x="140" y="802">지시 입력</text>
  <text class="body" x="110" y="830">채팅에 글을 쓴다</text>
  <text class="body" x="110" y="854">업로드(파일 선택) → uploads/ 자동 분석</text>
  <text class="body" x="110" y="878">긴급 정지 — 언제든 누를 수 있다</text>

  <rect class="stepGreen" x="900" y="770" width="420" height="100" rx="8"/>
  <text class="num" x="920" y="802">9</text>
  <text class="head" x="950" y="802">인증 · 전달</text>
  <text class="body" x="920" y="830">쿠키(m_sid)·PIN 확인 — 없으면 401</text>
  <text class="note" x="920" y="852">server.js가 탭별 경로를 나눈다</text>

  <rect class="step" x="900" y="912" width="420" height="150" rx="8"/>
  <text class="num" x="920" y="944">10</text>
  <text class="head" x="960" y="944">탭별 실행</text>
  <text class="body" x="920" y="972">메인 탭 — cwd로 창 찾기 → 콘솔 주입</text>
  <text class="note" x="920" y="994">(console_inject.ps1, 포커스는 안 뺏는다)</text>
  <text class="body" x="920" y="1020">서브 탭 — 해당 브릿지가 데몬을 실행</text>
  <text class="note" x="920" y="1042">(codex_bridge · antigravity_bridge)</text>

  <rect class="stepDark" x="1390" y="770" width="340" height="250" rx="8"/>
  <text class="numLight" x="1410" y="802">11</text>
  <text class="headLight" x="1450" y="802">워커 실행</text>
  <text class="bodyLight" x="1410" y="830">메인 — PC 창의 Claude Code가</text>
  <text class="bodyLight" x="1410" y="852">그대로 실행 (별도 세션 아님)</text>
  <text class="bodyLight" x="1410" y="884">서브 — Codex·Antigravity가 데몬 실행</text>
  <text class="bodyLight" x="1410" y="916">메인 → 서브 위임 시 delegate.js가</text>
  <text class="bodyLight" x="1410" y="938">파이프로 서브를 부르고, 결과는</text>
  <text class="bodyLight" x="1410" y="960">메인이 이어받는다</text>
  <text class="bodyLight" x="1410" y="992">같은 파일은 동시에 만지지 않는다</text>

  <rect class="step" x="900" y="1082" width="420" height="90" rx="8"/>
  <text class="num" x="920" y="1114">12</text>
  <text class="head" x="960" y="1114">결과 기록</text>
  <text class="body" x="920" y="1142">메인: transcript(.jsonl) · 서브: 메시지 JSON</text>

  <rect class="stepGreen" x="90" y="952" width="340" height="110" rx="8"/>
  <text class="num" x="110" y="984">13</text>
  <text class="head" x="150" y="984">폰에 표시</text>
  <text class="body" x="110" y="1012">1.2~1.5초 폴링으로 말풍선 갱신</text>
  <text class="note" x="110" y="1036">다음 지시는 8번으로 반복</text>

  <path class="flow" d="M 430 774 L 898 774"/>
  <text class="edgeLabel" x="670" y="768" text-anchor="middle">인증 요청 (쿠키·PIN 첨부)</text>
  <path class="flow" d="M 1110 870 L 1110 910"/>
  <text class="edgeLabel" x="1150" y="894" text-anchor="middle">탭별로 분기</text>
  <path class="flow" d="M 1320 925 L 1350 925 L 1350 850 L 1388 850"/>
  <path class="flowGray" d="M 1390 1005 L 1350 1005 L 1350 1100 L 1322 1100"/>
  <path class="flow" d="M 900 1100 L 670 1100 L 670 1006 L 430 1006"/>
  <text class="edgeLabel" x="670" y="1086" text-anchor="middle">폴링 응답</text>

  <text class="note" x="60" y="1270">2026-09-17 현행화 · 메인 워커 Antigravity → Claude Code · 최종 방식 = PC 창 + 콘솔 주입</text>
</svg>
